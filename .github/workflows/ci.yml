name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  smoke:
    name: Pruebas de humo (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Ejecutar pruebas
        run: python tests/smoke_test.py
